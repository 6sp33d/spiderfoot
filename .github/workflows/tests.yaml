name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            test/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test/requirements.txt

      - name: Lint with flake8
        # flake8-return 1.2.0 (latest) uses ast.NameConstant, which was removed
        # in Python 3.14, so lint on the other versions only.
        if: matrix.python-version != '3.14'
        run: python -m flake8 . --count --show-source --statistics

      - name: Test with pytest
        env:
          SPIDERFOOT_DATA: ${{ runner.temp }}/spiderfoot
        run: >-
          python -m pytest
          -n auto --dist loadfile
          --timeout 300
          --ignore=test/integration/modules/
          --durations=5
          --cov=. --cov-report term --cov-report xml
          .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true
